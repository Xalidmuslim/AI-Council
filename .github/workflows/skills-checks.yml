name: AI-Council skills verification

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.agents/**'
      - '.claude/**'
      - 'tests/**'
      - 'ANDROID_PLAYBOOK.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/skills-checks.yml'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict screenshot test dependencies
        run: python -m pip install -r requirements-visual-qa.txt
      - name: Validate Python tools, skill integration and host layouts
        run: python3 -m unittest discover -s tests -v
